name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q chaos-die-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6
      - run: gradle build
        working-directory: chaos-die
      - uses: actions/upload-artifact@v4
        with:
          name: chaosdie-jar
          path: |
            chaos-die/build/libs/*.jar
            !chaos-die/build/libs/*-sources.jar
